repos:
  - repo: local
    hooks:
      - id: prettier-format
        name: prettier (format)
        entry: npm run format
        language: system
        pass_filenames: false
        types: [text]
      - id: eslint-lint
        name: eslint (lint)
        entry: npm run lint
        language: system
        pass_filenames: false
        types: [text]
